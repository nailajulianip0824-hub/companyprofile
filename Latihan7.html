<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">
        <button class="btn bg-warning" data-bs-toggle="modal" data-bs-target="#contoh">Tampilkan dialog modal</button>
    </div>


    <div class="modal fade" id="Contoh" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary">Pesan Peringatan !</h5>
                    <button type="button" class="btn-close" data-bs-bisnis="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="text-danger">Selamat jalan di pemrograman Web dengan HTML dan CSS</p>
                </div>

                <div class="modal-footer">
                    <button class=""
                </div>

            </div>
        </div>
    </div>

</body>

</html>
