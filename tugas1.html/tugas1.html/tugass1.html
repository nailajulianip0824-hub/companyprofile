<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 1000px;
            margin: auto;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            height: 35px;
        }

        .kuning {
            background-color: #ffd800;
        }

        .biru {
            background-color: #00bcd4;
        }

        .merah {
            background-color: #f00000;
        }

        .biru-tua {
            background-color: #4169e1;
        }

        /* Baris 1 */
        .baris1 .kuning {
            grid-column: 1 / 4;
        }

        .baris1 .biru {
            grid-column: 4 / 13;
        }

        /* Baris 2 */
        .baris2 .merah {
            grid-column: 1 / 7;
        }

        .baris2 .kuning {
            grid-column: 7 / 13;
        }

        /* Baris 3 */
        .baris3 .biru-tua {
            grid-column: 1 / 13;
        }

        /* Baris 4 */
        .baris4 .kuning {
            grid-column: 1 / 11;
        }

        .baris4 .merah {
            grid-column: 11 / 13;
        }

        .row {
            margin-bottom: 2px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Baris 1 -->
        <div class="row baris1">
            <div class="kuning"></div>
            <div class="biru"></div>
        </div>

        <!-- Baris 2 -->
        <div class="row baris2">
            <div class="merah"></div>
            <div class="kuning"></div>
        </div>

        <!-- Baris 3 -->
        <div class="row baris3">
            <div class="biru-tua"></div>
        </div>

        <!-- Baris 4 -->
        <div class="row baris4">
            <div class="kuning"></div>
            <div class="merah"></div>
        </div>

    </div>

</body>
</html>
