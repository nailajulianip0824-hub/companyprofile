<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jadwal Piket</title>

    <style>
        .judul {
            background-color: #e0c000;
            padding: 10px;
            font-size: 25px;
            font-weight: bold;
            color: #555;
        }

        .jadwal {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .kolom {
            padding: 10px;
            min-height: 140px;
            font-size: 20px;
            font-weight: bold;
        }

        .senin {
            background-color: #08a9df;
        }

        .selasa {
            background-color: #00c98b;
        }

        .rabu {
            background-color: #e60000;
        }

        .kolom p {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div class="judul">
        JADWAL PIKET
    </div>

    <div class="jadwal">

        <div class="kolom senin">
            <p>SENIN</p>
            <p>AHMAD</p>
            <p>ASNAWI</p>
            <p>RUDI</p>
            <p>HAIKAL</p>
        </div>

        <div class="kolom selasa">
            <p>SELASA</p>
            <p>MARKONAH</p>
            <p>SAEPUDIN</p>
            <p>YAKUB</p>
            <p>DONO</p>
        </div>

        <div class="kolom rabu">
            <p>RABU</p>
            <p>JUKI</p>
            <p>MONO</p>
            <p>JALU</p>
            <p>SAHRUL</p>
        </div>

    </div>

</body>
</html>
