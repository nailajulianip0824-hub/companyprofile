<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-3 bg-warning rounded-5">
        <h2  style="text-center text-primary">FORMULIR PENDAFTARAN SISWA BARU</h2>

        <div class="mb-3 from-floating">
            <input type="text" placeholder="Masukan NIPD" class="form-control">
            <label>Masukan NIPD</label>
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label>
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>

        <div class="mb-3">
            <textarea class="form-control" placeholder="Alamat Jalan"></textarea>
            <label>Alamat Jalan</label>
        </div>

        <div class="mb-3">
            <select class="from select">
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Komputer Dan Jaringan</option>
                <option>Desain Komunikasi Fisual</option>
                <option>Bisnis Digital</option>
                <option>Akutansi</option>
            </select>
        </div>

        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul pramuka</label>

             <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul volly</label>

             <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul PMR</label>
        </div>

        <div>
            
        </div>

        <div class="row">
            <div class="col-6"><input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Laki Laki</label>
        </div>

            <div class="col-6"><input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Perempuan</label>
        
        </div>
        </div>

        <button type="button" class="btn btn-danger">Simpan Data</button>
        <button type="button" class="btn btn-success">Hapus Data</button>

    </div>

</body>
</html>
